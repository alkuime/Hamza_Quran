<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Engine v4 - QUL Powered</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap');

        /* إعداد خط التجويد الملون المحمل من QUL */
        @font-face {
            font-family: 'QUL_Tajweed_Font';
            /* استبدل المسار بملف الخط الخاص بـ QUL بعد تحميله */
            src: url('fonts/qul-tajweed-colored.woff2') format('woff2');
            font-display: swap;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f8f6f2; /* لون مريح للعين */
        }

        .quran-text {
            font-family: 'QUL_Tajweed_Font', 'Noto Naskh Arabic', serif;
            font-variant-ligatures: normal;
        }

        .word-card {
            transition: all 0.2s ease;
        }
        .word-card:hover {
            background-color: #fcfbf9;
            border-color: #d4af37;
        }
    </style>
</head>
<body class="text-gray-800 antialiased">

<div class="max-w-5xl mx-auto p-4 sm:p-6">

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200 mb-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-amber-800 flex items-center gap-2">
                    <span>📖</span> محرك ميزان النطق اللغوي (مصادر QUL)
                </h1>
                <p class="text-sm text-gray-500 mt-1">يعتمد على التفكيك الصرفي المباشر وقواعد بيانات التجويد الملونة.</p>
            </div>
            
            <div class="flex gap-2 w-full md:w-auto">
                <input id="surahSelect" type="number" min="1" max="114" value="1" 
                       class="border border-stone-300 p-3 rounded-xl w-24 text-center focus:outline-none focus:border-amber-600" 
                       placeholder="السورة">
                <button onclick="processQULData()" class="bg-amber-700 hover:bg-amber-800 text-white px-6 py-3 rounded-xl font-medium transition w-full md:w-auto">
                    تحليل النص والبيانات
                </button>
            </div>
        </div>
    </div>

    <div id="quranContainer" class="space-y-6"></div>

</div>

<script>
/* ==========================================================================
   محاكاة قاعدة بيانات QUL المدمجة (تحميل محلي من ملفاتك بعد تحميلها من الموقع)
   ========================================================================== */
const mockQULDatabase = {
    "surah_1": [
        {
            "ayah_number": 1,
            "words": [
                { "word_id": 1, "text_tajweed": "بِسْمِ", "translation": "In the name", "root": "ب س م", "stem": "بِسْمِ", "morphology": "جار ومجرور" },
                { "word_id": 2, "text_tajweed": "اللَّهِ", "translation": "of Allah", "root": "أ ل ه", "stem": "الله", "morphology": "لفظ الجلالة مضاف إليه" },
                { "word_id": 3, "text_tajweed": "الرَّحْمَٰنِ", "translation": "the Most Gracious", "root": "ر ح م", "stem": "رحمان", "morphology": "نعت مجرور (إدغام شمسى)" },
                { "word_id": 4, "text_tajweed": "الرَّحِيمِ", "translation": "the Most Merciful", "root": "ر ح م", "stem": "رحيم", "morphology": "نعت ثان (مد عارض للسكون)" }
            ]
        },
        {
            "ayah_number": 2,
            "words": [
                { "word_id": 5, "text_tajweed": "الْحَمْدُ", "translation": "All praise", "root": "ح م د", "stem": "حمد", "morphology": "مبتدأ مرفوع (إظهار قمري)" },
                { "word_id": 6, "text_tajweed": "لِلَّهِ", "translation": "be to Allah", "root": "أ l ه", "stem": "لله", "morphology": "جار ومجرور" },
                { "word_id": 7, "text_tajweed": "رَبِّ", "translation": "Lord", "root": "ر ب ب", "stem": "رب", "morphology": "مضاف إليه (حرف مشدد)" },
                { "word_id": 8, "text_tajweed": "الْعَالَمِينَ", "translation": "of the universes", "root": "ع ل م", "stem": "عالم", "morphology": "مضاف إليه (مد عارض)" }
            ]
        }
    ]
};

/* ==========================================================================
   محرك تفكيك المقاطع الصرفية واللفظية (NLP Pronunciation Engine)
   ========================================================================== */
function generateQULPronunciation(word) {
    // بالاعتماد على مصادر QUL، نستخدم الجذع والتحليل الصرفي لبناء الميزان بدقة
    let cleanText = word.text_tajweed;
    
    // قواعد فصل الحروف لعمل ميزان نطق مرئي (Syllabification)
    let syllables = [];
    let current = "";
    
    for (let i = 0; i < cleanText.length; i++) {
        let char = cleanText[i];
        current += char;
        
        // إذا كان الحرف يحتوي على سكون أو حرف مد أو تنوين، ينتهي المقطع الصوتي هنا
        if (/[َْٰاُِ can]/.test(char) && i < cleanText.length - 1) {
            // التحقق من الحرف القادم (إذا لم تكن شدة)
            if (cleanText[i+1] !== "ّ") {
                syllables.push(current);
                current = "";
            }
        }
        // معالجة الحرف المشدد (يفك إلى ساكن ومتحرك تلقائياً)
        else if (char === "ّ") {
            syllables.push(current);
            current = "";
        }
    }
    if (current) syllables.push(current);
    
    return syllables.filter(s => s.trim() !== "").join(" ⁃ ");
}

/* ==========================================================================
   المعالج الرئيسي لبناء واجهة الـ HTML
   ========================================================================== */
function processQULData() {
    const surahNum = document.getElementById("surahSelect").value;
    const container = document.getElementById("quranContainer");
    
    container.innerHTML = `
        <div class="text-center p-8 text-gray-500">
            <p>⏳ جاري قراءة قواعد بيانات QUL المحلية وتحليل الهياكل اللغوية...</p>
        </div>
    `;

    // استدعاء البيانات من الكائن المحلي (الذي يمثل ملف الـ JSON المحمل)
    const surahData = mockQULDatabase[`surah_${surahNum}`];

    if (!surahData) {
        container.innerHTML = `
            <div class="bg-red-50 p-4 rounded-xl text-red-700 text-center border border-red-200">
                ⚠️ عذراً، لم يتم العثور على ملفات البيانات لهذه السورة في المجلد المحلي حالياً.
            </div>
        `;
        return;
    }

    // بناء واجهة الآيات
    let htmlOutput = surahData.map(ayah => {
        
        // توليد مربعات "كلمة بكلمة" داخل الآية
        let wordsHTML = ayah.words.map(word => {
            const pronunciationStyle = generateQULPronunciation(word);
            
            return `
                <div class="word-card flex flex-col items-center bg-stone-50 border border-stone-200 p-3 rounded-xl min-w-[100px] flex-1 sm:flex-initial">
                    <span class="quran-text text-3xl text-stone-900 mb-1 select-all" title="حكم التجويد: ${word.morphology}">
                        ${word.text_tajweed}
                    </span>
                    
                    <span class="text-xs font-mono font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-100 mb-2 dir-ltr">
                        ${pronunciationStyle}
                    </span>

                    <span class="text-xs text-gray-500 font-medium text-center border-t border-stone-200 pt-1 w-full" dir="ltr">
                        ${word.translation}
                    </span>

                    <span class="text-[10px] text-stone-400 mt-1">
                        جذر: [ ${word.root} ]
                    </span>
                </div>
            `;
        }).join("");

        return `
            <div class="bg-white rounded-2xl shadow-sm border border-stone-200 p-6">
                <div class="flex flex-wrap gap-3 items-start justify-start mb-4">
                    ${wordsHTML}
                    
                    <div class="self-center flex items-center justify-center bg-amber-100 text-amber-900 font-bold rounded-full w-10 h-10 border border-amber-200 text-sm shadow-sm">
                        ${ayah.ayah_number}
                    </div>
                </div>
            </div>
        `;
    }).join("");

    container.innerHTML = htmlOutput;
}

// تشغيل تلقائي عند الفتح
window.onload = processQULData;
</script>

</body>
</html>
